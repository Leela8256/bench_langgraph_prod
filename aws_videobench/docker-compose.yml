# aws_videobench — RocketRide video pipeline, SMOKE configuration.
#
# This compose file is for the smoke test, NOT for measurement:
#   - no cpuset envelope (nothing is being compared yet)
#   - intra-op threads deliberately NOT pinned to 1, so a 21-minute meeting
#     transcribes at tolerable speed on a cold engine
# When this grows into a matched benchmark, copy the envelope discipline from
# aws_bench/docker-compose.yml verbatim: shared BENCH_CPUSET, OMP_NUM_THREADS=1
# on both arms, memory uncapped-but-measured, one arm at a time.

services:
  rocketride:
    build:
      context: ./arms/rocketride
      dockerfile: Dockerfile
    image: videobench-rocketride:3.3.1
    platform: linux/amd64
    container_name: videobench-rocketride
    environment:
      ROCKETRIDE_URI: ws://127.0.0.1:5565/task/service
      ROCKETRIDE_APIKEY: local-dev
      RR_HOST: "0.0.0.0"           # MUST be explicit: without it the engine
                                   # binds an interface unreachable from the host
    ports: ["5565:5565"]
    volumes:
      # Persist pip/HF/whisper/rf-detr downloads across container recreations.
      # First video pipeline start on a FRESH volume pulls several GB (torch
      # tree, whisper base, rf-detr-base.pth); with this volume that price is
      # paid once per box, not once per `compose up`.
      - rr-model-cache:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(s.connect_ex(('127.0.0.1',5565)))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  langgraph:
    # The LangGraph arm — same service the local and box smokes verified.
    # Never runs at the same time as rocketride in a measured run (one arm
    # at a time under the envelope).
    build:
      context: ./arms/langgraph
      dockerfile: Dockerfile
    image: videobench-langgraph:v1
    platform: linux/amd64
    container_name: videobench-langgraph
    ports: ["8200:8200"]
    volumes:
      - rr-model-cache:/root/.cache   # shared: rfdetr + miniLM download once per box
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/health/ready',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  smoke:
    # The CLIENT, in its own container: same discipline as the PDF bench —
    # client CPU/RSS must not land in the engine's cgroup, and the video
    # reaches the engine over a network hop like every future benchmark doc.
    build:
      context: ./smoke
      dockerfile: smoke.Dockerfile
    image: videobench-smoke:latest
    platform: linux/amd64
    container_name: videobench-smoke
    profiles: ["client"]          # never started by `up`; used via `compose run`
    environment:
      ROCKETRIDE_URI: "ws://rocketride:5565/task/service"
      ROCKETRIDE_APIKEY: local-dev
      # Which pipe contract this run executes — default is the dual-lane
      # (audio+vision) pipe; run scripts override for variants like
      # benchmark_video_detect.pipe.
      BENCH_PIPE: "${BENCH_PIPE:-/pipe/benchmark_video.pipe}"
      # Generous: rep 1 of a cold engine includes pip-installing the whisper +
      # rfdetr stacks and downloading model weights before any real work.
      BENCH_TIMEOUT_S: "${BENCH_TIMEOUT_S:-5400}"
      # Engine worker-pool request, passed to use(threads=N). Unset = engine
      # default pool (how every video run before 2026-08-20 ran). Requested
      # is not activated — effective cores come from the cgroup sampler.
      RR_THREADS: "${RR_THREADS:-}"
    volumes:
      - "${CORPUS:-./corpus}:/corpus:ro"
      - ./results:/results
      - ./pipe:/pipe:ro
      - ./bench:/bench:ro     # batch driver mounted, not baked — no rebuild to iterate

volumes:
  rr-model-cache:
